<!DOCTYPE html>
<html>
<head>
  <title>PAW Web SDK E2E Test</title>
</head>
<body>
  <h1>PAW Web SDK E2E Test Page</h1>
  <pre id="log"></pre>
  <script type="module">
    // Use the CDN version of wllama (same approach as the real BrowserPage)
    const WLLAMA_CDN = 'https://cdn.jsdelivr.net/gh/programasweights/wllama@f8b7d6b28696d0f9575f82df7a54de3adc6ea49c/esm';
    const API_URL = 'https://programasweights.com/api/v1';
    // Minimal inline SDK that mirrors the npm package behavior
    const paw = {
      async function(slugOrId, opts = {}) {
        const isHash = /^[a-f0-9]{16,64}$/.test(slugOrId);
        let programId = slugOrId;

        if (!isHash) {
          const resp = await fetch(`${API_URL}/programs/resolve/${encodeURIComponent(slugOrId)}`);
          if (!resp.ok) throw new Error(`Failed to resolve "${slugOrId}": ${resp.status}`);
          const data = await resp.json();
          programId = data.program_id;
        }

        // Load program details from API
        const detailResp = await fetch(`${API_URL}/programs/${programId}`);
        if (!detailResp.ok) throw new Error(`Failed to load program: ${detailResp.status}`);
        const detail = await detailResp.json();
        const runtime = detail.runtime || (
          detail.runtime_id
            ? await fetch(`${API_URL}/models/runtimes/${encodeURIComponent(detail.runtime_id)}`).then(r => {
                if (!r.ok) throw new Error(`Failed to load runtime: ${r.status}`);
                return r.json();
              })
            : null
        );
        if (!runtime || !runtime.js_sdk || !runtime.js_sdk.supported) {
          throw new Error(`Browser runtime unsupported for "${detail.runtime_id || detail.interpreter}"`);
        }

        const meta = {
          program_id: detail.id,
          spec: detail.spec,
          interpreter: detail.interpreter,
          compiler_snapshot: detail.compiler_snapshot,
          runtime_id: detail.runtime_id,
          runtime,
        };

        async function waitForReady(url) {
          for (let i = 0; i < 30; i++) {
            const head = await fetch(url, { method: 'HEAD' });
            if (head.status === 202) {
              await new Promise(r => setTimeout(r, 2000));
              continue;
            }
            if (head.ok) return;
            throw new Error(`Asset not ready: ${url} (${head.status})`);
          }
          throw new Error(`Timed out waiting for asset: ${url}`);
        }

        const promptUrl = `${API_URL}/programs/${programId}/asset/prompt_template.txt`;
        const adapterUrl = `${API_URL}/programs/${programId}/asset/${runtime.program_assets.adapter_filename || 'adapter.gguf'}`;
        const prefixCacheUrl = runtime.program_assets.prefix_cache_filename
          ? `${API_URL}/programs/${programId}/asset/${runtime.program_assets.prefix_cache_filename}`
          : null;
        const prefixTokensUrl = runtime.program_assets.prefix_tokens_filename
          ? `${API_URL}/programs/${programId}/asset/${runtime.program_assets.prefix_tokens_filename}`
          : null;

        await waitForReady(promptUrl);
        await waitForReady(adapterUrl);

        // Load prompt template from API-owned asset path
        const promptResp = await fetch(promptUrl);
        if (!promptResp.ok) throw new Error(`Failed to load prompt: ${promptResp.status}`);
        const promptTemplate = await promptResp.text();

        // Init wllama
        const { Wllama } = await import(`${WLLAMA_CDN}/index.js`);
        if (!window._wllama) {
          const wllama = new Wllama({
            'single-thread/wllama.wasm': `${WLLAMA_CDN}/single-thread/wllama.wasm`,
            'multi-thread/wllama.wasm': `${WLLAMA_CDN}/multi-thread/wllama.wasm`,
          }, { suppressNativeLog: true });

          const baseUrl = runtime.js_sdk.base_model.url
            || `https://huggingface.co/${runtime.js_sdk.base_model.repo}/resolve/main/${runtime.js_sdk.base_model.file}`;
          const baseResp = await fetch(baseUrl);
          const total = parseInt(baseResp.headers.get('content-length') || '0');
          const reader = baseResp.body.getReader();
          const chunks = [];
          let loaded = 0;
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.byteLength;
            if (opts.onProgress) opts.onProgress({ loaded, total, stage: 'base-model' });
          }
          await wllama.loadModel([new Blob(chunks)], { n_ctx: 2048 });
          window._wllama = wllama;
        }

        const wllama = window._wllama;
        const adapterId = await wllama.loadLoraAdapter(adapterUrl, { scale: opts.scale ?? 1.0 });

        // Load prefix cache
        let prefixTokenCount = 0;
        try {
          if (prefixCacheUrl && prefixTokensUrl) {
            const [cacheResp, tokResp] = await Promise.all([
              fetch(prefixCacheUrl),
              fetch(prefixTokensUrl),
            ]);
            if (cacheResp.ok && tokResp.ok) {
            const cacheBlob = await cacheResp.blob();
            const tokens = await tokResp.json();
            prefixTokenCount = await wllama.loadSession(cacheBlob, tokens);
            }
          }
        } catch {}

        const parts = promptTemplate.split('{INPUT_PLACEHOLDER}');
        const prefix = parts[0];
        const suffix = parts.length > 1 ? parts[1] : '';

        const callable = async (input) => {
          if (prefixTokenCount > 0) await wllama.kvRemove(prefixTokenCount, -1);
          const result = await wllama.createCompletion(prefix + input + suffix, {
            nPredict: opts.maxTokens ?? 512,
            useCache: true,
            sampling: { temp: opts.temperature ?? 0 },
          });
          return result.trim();
        };
        callable.free = async () => { await wllama.freeLoraAdapter(adapterId); };
        callable.spec = meta.spec;
        callable.programId = meta.program_id;
        callable.interpreter = meta.interpreter;
        return callable;
      },
      configure(config) {
        // API URL config (not needed for E2E since we use production)
      }
    };

    window.paw = paw;
    window.testLog = [];
    window.log = (msg) => {
      window.testLog.push(msg);
      document.getElementById('log').textContent += msg + '\n';
    };
    window.log('SDK loaded');
  </script>
</body>
</html>
